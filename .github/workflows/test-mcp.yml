name: MCP Test Automation
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install MCP Server
        run: cd mcp-test-server && npm ci
      - name: Run Full Test Pipeline ✅
        run: cd mcp-test-server && npm run testall
        